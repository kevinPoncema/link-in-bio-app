services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: link-bio-backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - ./backend/vendor:/var/www/vendor
    networks:
      - link-bio-network
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
    # Run the Laravel development server so the backend is directly accessible from the host
    command: sh -c "php artisan serve --host=0.0.0.0 --port=8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: link-bio-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - ./frontend/node_modules:/app/node_modules
    networks:
      - link-bio-network
    depends_on:
      - backend
  db:
    image: mysql:8.0
    container_name: link-bio-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-link_bio}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-link_bio}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/my.cnf
    networks:
      - link-bio-network

volumes:
  mysql_data:
    driver: local

networks:
  link-bio-network:
    driver: bridge