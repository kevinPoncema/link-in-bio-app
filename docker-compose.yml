services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: link-in-bio-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: link_in_bio
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - link-in-bio-network

  # Backend - Laravel API
  backend:
    build:
      context: .
      dockerfile: backend.dockerfile
    container_name: link-in-bio-backend
    restart: always
    ports:
      - "8003:8003"
    volumes:
      - ./backend:/var/www/html
      - backend_storage:/var/www/html/storage
    networks:
      - link-in-bio-network
    depends_on:
      - mysql

  # Frontend - React + Vite
  frontend:
    build:
      context: .
      dockerfile: frontend.dockerfile
    container_name: link-in-bio-frontend
    restart: always
    ports:
      - "2999:2999"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - link-in-bio-network
    depends_on:
      - backend

# Redes

networks:
  link-in-bio-network:
    driver: bridge
    name: link-in-bio-network

# Volúmenes persistentes
volumes:
  backend_storage:
    name: link-in-bio-backend-storage
    driver: local
  backend_logs:
    name: link-in-bio-backend-logs
    driver: local
  profile_pictures:
    name: link-in-bio-profile-pictures
    driver: local
  mysql_data:
    name: link-in-bio-mysql-data
    driver: local
# Volúmenes
volumes:
  mysql_data:
  backend_storage: