services:
  # Servicio Backend - Laravel API
  backend:
    build:
      context: .
      dockerfile: backend.dockerfile
    container_name: link-in-bio-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:8000"
    env_file:
      - ./.env
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_logs:/var/www/html/storage/logs
      - profile_pictures:/var/www/html/storage/app/public/profile-pictures
    networks:
      - link-in-bio-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy

  # Servicio Frontend - React SPA
  frontend:
    build:
      context: .
      dockerfile: frontend.dockerfile
      target: production
    container_name: link-in-bio-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    env_file:
      - ./.env
    networks:
      - link-in-bio-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - backend

  # Base de datos MySQL
  mysql:
    image: mysql:8.0
    container_name: link-in-bio-mysql
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/migrations:/docker-entrypoint-initdb.d
    networks:
      - link-in-bio-network
    ports:
      - "${MYSQL_PORT}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password

# Red personalizada para comunicación entre servicios
networks:
  link-in-bio-network:
    driver: bridge
    name: link-in-bio-network

# Volúmenes persistentes
volumes:
  backend_storage:
    name: link-in-bio-backend-storage
    driver: local
  backend_logs:
    name: link-in-bio-backend-logs
    driver: local
  profile_pictures:
    name: link-in-bio-profile-pictures
    driver: local
  mysql_data:
    name: link-in-bio-mysql-data
    driver: local