version: '3.8'

services:
  # Servicio Backend - Laravel API
  backend:
    build:
      context: .
      dockerfile: backend.dockerfile
    container_name: link-in-bio-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=link_in_bio_db
      - DB_USERNAME=link_user
      - DB_PASSWORD=link_password+
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_logs:/var/www/html/storage/logs
    networks:
      - link-in-bio-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy

  # Servicio Frontend - React SPA
  frontend:
    build:
      context: .
      dockerfile: frontend.dockerfile
      target: production
    container_name: link-in-bio-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://backend:8000/api
    networks:
      - link-in-bio-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - backend

  # Base de datos MySQL
  mysql:
    image: mysql:8.0
    container_name: link-in-bio-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=link_in_bio_db
      - MYSQL_USER=link_user
      - MYSQL_PASSWORD=link_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/migrations:/docker-entrypoint-initdb.d
    networks:
      - link-in-bio-network
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "link_user", "-plink_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password

# Red personalizada para comunicación entre servicios
networks:
  link-in-bio-network:
    driver: bridge
    name: link-in-bio-network

# Volúmenes persistentes
volumes:
  backend_storage:
    name: link-in-bio-backend-storage
    driver: local
  backend_logs:
    name: link-in-bio-backend-logs
    driver: local
  mysql_data:
    name: link-in-bio-mysql-data
    driver: local